<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Moroscope mockup F: Star Atlas (airy timeline)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
<style>
  /* ---------- Star Atlas: colours, the title typeface, corner radius, chart-paper background ---------- */
  body { --hfont:'IM Fell English',Georgia,serif; --radius:12px; }
  body[data-s="atlas"] { --paper:#0C1A2C; --card:#12243A; --cell:rgba(255,255,255,.04); --ink:#EFE6D0; --body:#CFC7B2; --soft:#93A0B0; --line:rgba(201,164,92,.38); --edge:rgba(255,255,255,.09); --rule:#C9A45C;
    --accent:#C9A45C; --onaccent:#0C1A2C; --accent2:#8FD0B5; --good:#8FD0B5; --care:#E59A76; --key:#B3C0F5; --btnbg:#C9A45C; --btnfg:#0C1A2C;
    --hfont:'IM Fell English',Georgia,serif; --radius:3px;
    background:linear-gradient(rgba(201,164,92,.05) 1px,transparent 1px) 0 0/100% 72px, linear-gradient(90deg,rgba(201,164,92,.05) 1px,transparent 1px) 50% 0/72px 100%, radial-gradient(ellipse 100% 800px at 50% 0,#1E3D64,#0C1A2C) #0C1A2C; }

  /* ---------- Base ---------- */
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background-color:var(--paper); color:var(--ink); font:16px/1.6 'DM Sans',system-ui,sans-serif; min-height:100vh; padding-bottom:76px; overflow-x:hidden; }
  button, select { font:inherit; color:inherit; } button { cursor:pointer; }
  a { color:inherit; text-underline-offset:3px; }
  .good { --c:var(--good); } .care { --c:var(--care); } .key { --c:var(--key); }
  .wrap { max-width:1180px; margin:0 auto; padding:0 20px; }
  .lbl { font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--soft); }
  .badge { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color:var(--c); background:color-mix(in srgb,var(--c) 16%,transparent); border:1px solid color-mix(in srgb,var(--c) 45%,transparent); border-radius:999px; padding:1px 9px; white-space:nowrap; }
  .tag { font-size:12px; color:var(--soft); border:1px solid var(--edge); border-radius:999px; padding:1px 9px; white-space:nowrap; }
  .moonic { width:11px; height:11px; flex:none; }

  /* ---------- Masthead ---------- */
  .top { border-bottom:1px solid var(--rule); }
  .top .wrap { padding-top:14px; padding-bottom:14px; text-align:center; }
  .dateline { display:flex; align-items:center; justify-content:center; gap:10px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--soft); }
  .dateline #date { display:none; }
  .brand { font-family:var(--hfont); font-weight:600; font-size:32px; line-height:1.15; margin-top:10px; }
  .links { display:none; justify-content:center; gap:28px; margin-top:10px; font-size:13px; letter-spacing:.12em; text-transform:uppercase; } .links a { text-decoration:none; color:var(--soft); } .links a.on { color:var(--ink); font-weight:700; }

  /* ---------- Hero: the month, its theme, and what is active now ---------- */
  .hero { position:relative; overflow:hidden; }
  .wheelbg { position:absolute; right:-150px; top:-70px; width:380px; height:380px; color:var(--accent); opacity:.16; pointer-events:none; }
  .wheelbg svg { width:100%; height:100%; overflow:visible; } .wheelbg text { fill:currentColor; stroke:none; font-size:19px; }
  .wheelbg g { transform-origin:200px 200px; } .wheelbg .spin { animation:spin 180s linear infinite; } .wheelbg .spin2 { animation:spin 120s linear infinite reverse; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .heroin { position:relative; display:grid; grid-template-columns:minmax(0,1fr); gap:32px; padding-top:28px; padding-bottom:40px; }
  .kicker { font-size:12px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); }
  h1 { font-family:var(--hfont); font-weight:500; font-size:48px; line-height:1.04; margin-top:10px; } h1 em { font-style:normal; color:var(--accent); }
  .lead { font-family:var(--hfont); font-size:19px; line-height:1.55; color:var(--body); margin-top:18px; max-width:33em; }
  .actions { display:flex; flex-wrap:wrap; align-items:center; gap:12px 18px; margin-top:26px; font-size:13px; color:var(--soft); }
  .btn { background:var(--btnbg); color:var(--btnfg); border:0; border-radius:var(--radius); padding:13px 22px; font-weight:700; font-size:15px; white-space:nowrap; }
  .nowcard { align-self:center; padding:24px; border-radius:var(--radius); border:1px solid var(--accent); background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 18%,var(--card)),var(--card) 65%); box-shadow:0 24px 60px -28px rgba(0,0,0,.45); }
  .nowmain { text-align:left; background:none; border:0; display:block; width:100%; }
  .nowmain .lbl { color:var(--accent); display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .pulse { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 0 var(--accent); animation:ping 2s infinite; }
  @keyframes ping { to { box-shadow:0 0 0 9px transparent; } }
  @media (prefers-reduced-motion:reduce) { .pulse, .ev.flash, .wheelbg g { animation:none !important; } }
  .nowmain h2 { font-family:var(--hfont); font-weight:400; font-size:33px; line-height:1.15; margin-top:10px; }
  .nowmain .do { margin-top:8px; font-size:17px; color:var(--body); } .nowmain .do b { color:var(--ink); }
  .nowmain .chips { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px; margin-top:14px; }
  .nowcard .quiet { font-size:15px; color:var(--soft); }

  /* ---------- Filter pills ---------- */
  .pills { display:flex; gap:10px; overflow-x:auto; margin:0 -20px; padding:0 20px 2px; scrollbar-width:none; }
  .pill { border:1px solid var(--edge); background:var(--card); border-radius:999px; padding:8px 16px; font-size:15px; font-weight:500; white-space:nowrap; }
  .pill small { color:var(--soft); font-size:12px; margin-left:4px; }
  .pill.on { background:var(--accent); border-color:var(--accent); color:var(--onaccent); font-weight:700; } .pill.on small { color:inherit; opacity:.75; }

  /* ---------- Workspace ---------- */
  .work { display:grid; grid-template-columns:minmax(0,1fr); gap:36px; margin-top:28px; }
  .panel { background:var(--card); border:1px solid var(--edge); border-radius:var(--radius); padding:16px; }
  .dow, .wk { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
  .dow b { text-align:center; font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--soft); padding-bottom:6px; }
  .wk { grid-auto-rows:17px; row-gap:2px; padding:7px 0 11px; border-top:1px solid var(--edge); }
  .d { grid-row:1 / span 2; height:36px; background:none; border:0; display:grid; place-items:center; font-size:16px; font-weight:500; }
  .d span { width:32px; height:32px; line-height:32px; border-radius:50%; text-align:center; }
  .d.past { color:var(--soft); } .d.dim { opacity:.35; }
  .d.today span { background:var(--accent); color:var(--onaccent); font-weight:700; }
  .d.pick span { box-shadow:0 0 0 2px var(--accent); }
  .cal[data-t="good"] { --rc:var(--good); } .cal[data-t="care"] { --rc:var(--care); } .cal[data-t="key"] { --rc:var(--key); }
  .d.inrange { background:color-mix(in srgb,var(--rc) 24%,transparent); } .d.rs { border-radius:10px 0 0 10px; } .d.re { border-radius:0 10px 10px 0; } .d.rs.re { border-radius:10px; }
  .bar { min-width:0; margin:0 2px; border:0; border-radius:999px; background:var(--c); color:var(--paper); font-size:11px; font-weight:700; line-height:17px; padding:0 7px; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:3px; }
  .bar.cl { border-top-left-radius:0; border-bottom-left-radius:0; margin-left:0; } .bar.cr { border-top-right-radius:0; border-bottom-right-radius:0; margin-right:0; }
  .bar.dim { opacity:.15; } .bar.on { box-shadow:0 0 0 2px var(--paper), 0 0 0 3.5px var(--c); }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; font-size:12px; color:var(--soft); } .legend i { display:inline-block; width:16px; height:7px; border-radius:4px; background:var(--c); margin-right:6px; }
  .calnote { margin-top:10px; font-size:13px; color:var(--soft); min-height:20px; } .calnote button { background:none; border:0; text-decoration:underline; text-underline-offset:3px; color:var(--ink); }

  /* ---------- Timeline ---------- */
  .tlhead { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .tlhead h2 { font-family:var(--hfont); font-size:28px; font-weight:500; line-height:1.2; } .tlhead span { font-size:13px; color:var(--soft); }
  .tl { position:relative; margin-top:20px; padding-left:22px; display:grid; gap:18px; }
  .tl::before { content:''; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:rgba(255,255,255,.14); }
  .todaymark { position:relative; font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); display:flex; align-items:center; gap:10px; }
  .todaymark::before { content:''; position:absolute; left:-21px; width:12px; height:12px; border-radius:50%; background:var(--accent); }
  .todaymark::after { content:''; flex:1; height:1px; background:var(--accent); }
  .ev { position:relative; background:var(--card); border:1px solid var(--edge); border-radius:var(--radius); padding:20px 22px; cursor:pointer; scroll-margin:90px; }
  .ev::before { content:''; position:absolute; left:-20px; top:26px; width:10px; height:10px; border-radius:50%; background:var(--c); box-shadow:0 0 0 3px var(--paper); }
  .ev .row1 { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px; }
  .when { font-size:15px; font-weight:700; margin-right:4px; }
  .kind { font-size:13px; font-weight:700; color:var(--c); display:inline-flex; align-items:center; gap:5px; } .topics { font-size:13px; color:var(--soft); display:inline-flex; align-items:center; gap:5px; }
  .rel { margin-left:auto; font-size:12px; color:var(--soft); } .rel.is { color:var(--accent); font-weight:700; }
  .ev h3 { font-family:var(--hfont); font-weight:400; font-size:27px; line-height:1.2; margin-top:8px; }
  .ev .insight { margin-top:8px; color:var(--body); }
  .ev .action { margin-top:10px; padding-left:14px; border-left:3px solid var(--c); font-weight:600; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  .ev footer { display:none; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; margin-top:16px; font-size:13px; color:var(--soft); }
  .ev.sel footer, .ev.now footer, .ev:focus-within footer { display:flex; }
  .addcal { background:none; border:1px solid rgba(255,255,255,.22); border-radius:999px; padding:5px 11px; font-size:12.5px; font-weight:600; color:var(--ink); white-space:nowrap; } .addcal.done { border-color:var(--good); color:var(--good); }
  /* Folded dates take one line; click to open. Past dates sit behind the "earlier dates" line. */
  .earlier { justify-self:start; background:none; border:0; padding:2px 0; font-size:14px; color:var(--soft); } .earlier u { text-underline-offset:3px; color:var(--ink); }
  .ev.past { opacity:.7; } .ev.past:hover, .ev.past.sel, .ev.past.open { opacity:1; }
  .ev.fold:not(.open) { padding:12px 22px; } .ev.fold:not(.open)::before { top:18px; }
  .ev.fold:not(.open) .insight, .ev.fold:not(.open) .action, .ev.fold:not(.open) footer, .ev.fold:not(.open) .topics { display:none; }
  .ev.fold:not(.open) h3 { font-size:20px; margin-top:2px; }
  .ev.fold .rel::after { content:' \00B7  show'; } .ev.fold.open .rel::after { content:' \00B7  hide'; }
  .ev.now { border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent); }
  .ev.sel { border-color:var(--c); box-shadow:0 0 0 2px var(--c); }
  .ev.flash { animation:flash 1.4s ease-out; }
  @keyframes flash { 0% { box-shadow:0 0 0 6px var(--accent); } 100% { box-shadow:0 0 0 2px var(--c); } }
  .empty { font-size:14px; color:var(--soft); padding:20px 0; }
  .srcs { margin:48px 0 8px; padding-top:14px; border-top:1px solid var(--edge); display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:13px; color:var(--soft); }
  .srcs .tag em { font-style:normal; opacity:.7; margin-left:5px; }
  .tabs { position:fixed; z-index:3; inset:auto 0 0 0; display:grid; grid-template-columns:repeat(3,1fr); background:var(--paper); border-top:1px solid var(--edge); text-align:center; font-size:13px; }
  .tabs a { padding:17px 0; text-decoration:none; color:var(--soft); } .tabs a.on { color:var(--ink); font-weight:700; }

  @media (min-width:900px) {
    .dateline { justify-content:space-between; }
    body { padding-bottom:64px; } .tabs { display:none; } .wrap { padding:0 32px; }
    .brand { font-size:46px; } .links { display:flex; } .dateline #date { display:inline; }
    .wheelbg { width:640px; height:640px; right:-120px; top:-150px; }
    .heroin { grid-template-columns:minmax(0,1fr) 430px; gap:72px; padding-top:48px; padding-bottom:72px; align-items:center; }
    h1 { font-size:80px; } .lead { font-size:21px; } .nowcard { padding:28px; }
    .pills { margin:0; padding:0; }
    .work { grid-template-columns:400px minmax(0,1fr); gap:48px; align-items:start; margin-top:32px; }
    .calcol { position:sticky; top:20px; } .panel { padding:22px; }
    .ev { padding:24px 28px; }
  }

  /* ---------- Star Atlas heading ---------- */
  .top { border-bottom:3px double var(--rule); }
  .brand { text-transform:uppercase; letter-spacing:.22em; font-weight:400; color:var(--accent); }
  .kicker { font-family:var(--hfont); font-style:italic; text-transform:none; letter-spacing:.02em; font-size:19px; font-weight:400; }
  h1 { font-weight:400; } .lead { font-family:var(--hfont); font-size:21px; color:var(--ink); }

  /* ---------- Stars and constellations behind the page ---------- */
  body { position:relative; }
  .deco { position:absolute; inset:0 0 auto 0; height:1500px; overflow:hidden; pointer-events:none; z-index:0; -webkit-mask-image:linear-gradient(#000 60%,transparent); mask-image:linear-gradient(#000 60%,transparent); }
  .deco svg { position:absolute; left:50%; top:0; width:1500px; margin-left:-750px; color:var(--accent); opacity:.55; }
  .top, .hero, main { position:relative; z-index:1; }
</style>
</head>
<body data-s="atlas">
<div class="deco" id="deco" aria-hidden="true"></div>
<header class="top"><div class="wrap">
  <div class="dateline">
    <span id="date"></span>
    <span id="sign"></span>
  </div>
  <div class="brand">Moroscope</div>
  <nav class="links"><a class="on" href="#">Month</a><a href="#">Sources</a><a href="#">You</a></nav>
</div></header>

<section class="hero">
  <div class="wheelbg" id="wheelbg" aria-hidden="true"></div>
  <div class="wrap heroin">
    <div>
      <p class="kicker">Your month, from the astrologers you trust</p>
      <h1 id="title"></h1>
      <p class="lead" id="theme"></p>
      <div class="actions"><button class="btn">Add the month to my calendar</button><span id="updated"></span></div>
    </div>
    <section class="nowcard" id="now" aria-label="Active now and this week"></section>
  </div>
</section>

<main class="wrap">
  <div class="pills" id="pills" role="group" aria-label="Filter by topic"></div>
  <div class="work">
    <div class="calcol">
      <div class="panel cal" id="cal">
        <div class="dow"><b>Mon</b><b>Tue</b><b>Wed</b><b>Thu</b><b>Fri</b><b>Sat</b><b>Sun</b></div>
        <div id="weeks"></div>
        <div class="legend"><span class="good"><i></i>Good time to</span><span class="care"><i></i>Be careful</span><span class="key"><i></i>Key date</span></div>
        <p class="calnote" id="calnote"></p>
      </div>
    </div>
    <section>
      <div class="tlhead"><h2 id="tltitle"></h2><span id="tlcount"></span></div>
      <div class="tl" id="tl"></div>
    </section>
  </div>
  <div class="srcs" id="srcs"></div>
</main>
<nav class="tabs"><a class="on" href="#">Month</a><a href="#">Sources</a><a href="#">You</a></nav>

<script src="data.js"></script>
<script>
  const M = window.MOCK, E = M.events, $ = (id) => document.getElementById(id);
  const all = (sel) => document.querySelectorAll(sel);
  const covers = (e, d) => d >= e.from && d <= M.end(e);
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const moonIcon = (kind) => kind ? `<svg class="moonic" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.800" fill="${kind === 'full' ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.400"/></svg>` : '';
  const moonName = { new: 'New Moon', full: 'Full Moon' };
  const rel = (e) => M.end(e) < M.today ? 'Past' : e.from <= M.today ? 'Now' : e.from === M.today + 1 ? 'Tomorrow' : `In ${e.from - M.today} days`;

  // State: the topic filter, the selected event and day, and the event under the pointer.
  let topic = 'All', selEv = null, selDay = null, hoverEv = null;
  const opened = new Set(); // folded dates the user unfolded
  let showPast = false; // the earlier dates are tucked behind one line
  // The date shown in the "Active now" card is folded in the timeline: it is already on screen.
  const nowMain = E.findIndex((e) => covers(e, M.today));
  const match = (e) => topic === 'All' || e.topics.includes(topic);
  // Topics come from the events; M.topics only fixes their order.
  const rank = (t) => (M.topics.indexOf(t) + 1) || 99;
  const TOPICS = [...new Set(E.flatMap((e) => e.topics))].sort((a, b) => rank(a) - rank(b));

  $('title').innerHTML = `${M.month} <em>${M.year}</em>`;
  $('date').textContent = `${M.wd(M.today)} ${M.today} ${M.month} ${M.year}`;
  $('sign').textContent = `${M.glyph} ${M.sign} edition`;
  $('theme').textContent = M.theme;
  $('updated').textContent = `Updated today · ${M.usedCount} of ${M.sources.length} sources had a forecast`;
  $('srcs').innerHTML = `<span>Read for this forecast:</span>` + M.sources.map((s) => `<span class="tag">${s.name}<em>${s.status}</em></span>`).join('');

  // ----- Decorative zodiac wheel behind the heading, the user's sign at the top -----
  {
    const SIGNS = ['Aries', 'Taurus', 'Gemini', 'Cancer', 'Leo', 'Virgo', 'Libra', 'Scorpio', 'Sagittarius', 'Capricorn', 'Aquarius', 'Pisces'];
    const pol = (r, deg) => { const a = (deg - 90) * Math.PI / 180; return `${(200 + r * Math.cos(a)).toFixed(1)} ${(200 + r * Math.sin(a)).toFixed(1)}`; };
    const ring = (r, extra = '') => `<circle cx="200" cy="200" r="${r}" ${extra}/>`;
    const me = SIGNS.indexOf(M.sign);
    let outer = `<path d="M${pol(192, -15)}A192 192 0 0 1 ${pol(192, 15)}L${pol(152, 15)}A152 152 0 0 0 ${pol(152, -15)}Z" fill="currentColor" fill-opacity=".35" stroke="none"/>${ring(192, 'stroke-width="2"')}${ring(152)}`, ticks = '';
    for (let i = 0; i < 12; i++) {
      const deg = (i - me) * 30, [x, y] = pol(172, deg).split(' ');
      outer += `<path d="M${pol(152, deg + 15)}L${pol(192, deg + 15)}"/><text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${String.fromCharCode(0x2648 + i)}\uFE0E</text>`;
    }
    for (let i = 0; i < 72; i++) ticks += `<line x1="200" y1="${i % 6 ? 62 : 56}" x2="200" y2="70" transform="rotate(${i * 5} 200 200)"/>`;
    $('wheelbg').innerHTML = `<svg viewBox="0 0 400 400" fill="none" stroke="currentColor" stroke-width="1.300"><g class="spin">${outer}</g>
      <g class="spin2">${ring(146, 'stroke-dasharray="2 8"')}${ticks}</g>${[118, 96, 76, 58, 42, 28].map((r) => ring(r, 'stroke-width=".9"')).join('')}</svg>`;
  }

  // ----- Active now / this week -----
  function renderNow() {
    const idx = E.map((_, i) => i);
    const active = idx.filter((i) => covers(E[i], M.today)), upcoming = idx.filter((i) => E[i].from > M.today);
    const main = active.length ? active[0] : upcoming[0];
    if (main === undefined) { $('now').innerHTML = `<p class="quiet">Nothing more is forecast for ${M.month}.</p>`; return; }
    const e = E[main], isNow = active.length > 0, left = M.end(e) - M.today;
    const head = isNow
      ? `<i class="pulse"></i>Active now · ${left ? `through ${M.wd(M.end(e))} ${M.end(e)} (${plural(left, 'more day')})` : 'today only'}`
      : `Next up · starts ${M.wd(e.from)} ${e.from} (${rel(e).toLowerCase()})`;
    $('now').innerHTML = `<button class="nowmain ${e.type}" data-ev="${main}"><span class="lbl">${head}</span><h2>${e.title}</h2>
      <p class="do"><b>Do this:</b> ${e.action}</p>
      <span class="chips"><span class="kind">${M.typeLabel[e.type]}</span><span class="topics">· ${e.topics.join(', ')}</span></span></button>`;
  }

  // ----- Filter pills -----
  function renderPills() {
    $('pills').innerHTML = ['All', ...TOPICS].map((t) => {
      const n = t === 'All' ? E.length : E.filter((e) => e.topics.includes(t)).length;
      return `<button class="pill${t === topic ? ' on' : ''}" data-topic="${t}" aria-pressed="${t === topic}">${t}<small>${n}</small></button>`;
    }).join('');
  }

  // ----- Calendar: one grid per week, events as bars that span their days -----
  function renderCalendar() {
    const offset = (M.dow(1) + 6) % 7, weeks = Math.ceil((M.days + offset) / 7);
    const placed = [];
    for (let w = 0; w < weeks; w++) {
      const first = Math.max(1, w * 7 - offset + 1), last = Math.min(M.days, w * 7 - offset + 7), lanes = [], segs = [];
      E.forEach((e, i) => {
        const s = Math.max(e.from, first), t = Math.min(M.end(e), last);
        if (s > t) return;
        let lane = lanes.findIndex((end) => end < s);
        if (lane < 0) lane = lanes.length;
        lanes[lane] = t;
        segs.push({ i, s, t, lane });
      });
      placed.push({ first, last, segs, lanes: lanes.length });
    }
    const maxLanes = Math.max(1, ...placed.map((p) => p.lanes));
    const col = (d) => ((d - 1 + offset) % 7) + 1;
    $('weeks').innerHTML = placed.map(({ first, last, segs }) => {
      let h = `<div class="wk" style="grid-template-rows:17px 17px repeat(${maxLanes},18px)">`;
      for (let d = first; d <= last; d++) {
        const hit = E.some((e) => covers(e, d) && match(e));
        const cls = [d < M.today ? 'past' : '', d === M.today ? 'today' : '', topic !== 'All' && !hit ? 'dim' : '', d === selDay ? 'pick' : ''].join(' ');
        h += `<button class="d ${cls}" data-day="${d}" style="grid-column:${col(d)}" aria-label="${M.wd(d)} ${d} ${M.month}"><span>${d}</span></button>`;
      }
      for (const { i, s, t, lane } of segs) {
        const e = E[i], cls = [e.type, match(e) ? '' : 'dim', s > e.from ? 'cl' : '', t < M.end(e) ? 'cr' : ''].join(' ');
        h += `<button class="bar ${cls}" data-ev="${i}" style="grid-column:${col(s)} / span ${t - s + 1};grid-row:${3 + lane}" title="${M.range(e)}: ${e.title}" aria-label="${M.range(e)}: ${M.typeLabel[e.type]}, ${e.title}">${s === e.from || col(s) === 1 ? (e.moon ? moonIcon(e.moon) + moonName[e.moon].split(' ')[0] : e.topics[0]) : ''}</button>`;
      }
      return h + '</div>';
    }).join('');
  }

  // ----- Timeline -----
  function renderTimeline() {
    const shown = E.map((e, i) => i).filter((i) => match(E[i]));
    $('tltitle').textContent = topic === 'All' ? `${M.month} timeline` : `${topic} in ${M.month}`;
    $('tlcount').textContent = `${plural(shown.length, 'date')}${topic === 'All' ? '' : ` of ${E.length}`}`;
    const past = shown.filter((i) => rel(E[i]) === 'Past');
    let h = past.length ? `<button class="earlier" data-earlier aria-expanded="${showPast}">${plural(past.length, 'earlier date')} · <u>${showPast ? 'hide' : 'show'}</u></button>` : '', marked = false;
    for (const i of shown) {
      const e = E[i], r = rel(e);
      if (r === 'Past' && !showPast) continue;
      if (!marked && M.end(e) >= M.today) { marked = true; h += `<div class="todaymark">Today · ${M.wd(M.today)} ${M.today} ${M.month}</div>`; }
      h += `<article class="ev ${e.type}${r === 'Past' ? ' past' : r === 'Now' ? ' now' : ''}${r === 'Past' || i === nowMain ? ' fold' + (opened.has(i) ? ' open' : '') : ''}" id="ev-${i}" data-ev="${i}" tabindex="0">
        <div class="row1"><span class="when">${M.range(e)}</span><span class="kind">${M.typeLabel[e.type]}</span>
          <span class="topics">· ${e.moon ? `${moonIcon(e.moon)}${moonName[e.moon]} · ` : ''}${e.topics.join(', ')}</span>
          <span class="rel${r === 'Now' ? ' is' : ''}">${r}</span></div>
        <h3>${e.title}</h3>
        <p class="insight">${e.insight}</p>
        <p class="action"><span class="sr">Do this: </span>${e.action}</p>
        <footer><span>Sources: ${e.sources.map((s) => `<a href="#">${s}</a>`).join(', ')}</span><button class="addcal">+ Add to calendar</button></footer></article>`;
    }
    $('tl').innerHTML = h || `<p class="empty">No ${topic.toLowerCase()} dates this month.</p>`;
  }

  // ----- Sync between the two columns -----
  function paint() {
    const i = hoverEv ?? selEv, e = i == null ? null : E[i];
    if (e) $('cal').dataset.t = e.type;
    all('.d').forEach((el) => {
      const d = +el.dataset.day, inr = !!e && covers(e, d);
      el.classList.toggle('inrange', inr);
      el.classList.toggle('rs', inr && d === e.from);
      el.classList.toggle('re', inr && d === M.end(e));
      el.classList.toggle('pick', d === selDay);
    });
    all('.bar').forEach((el) => el.classList.toggle('on', +el.dataset.ev === i));
    all('.ev').forEach((el) => el.classList.toggle('sel', +el.dataset.ev === selEv));
  }
  function reveal(ids) {
    if (!showPast && ids.some((i) => rel(E[i]) === 'Past')) { showPast = true; renderTimeline(); paint(); }
    const first = $(`ev-${ids[0]}`);
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    ids.forEach((i) => { const el = $(`ev-${i}`); if (el) { opened.add(i); el.classList.add('open'); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } });
  }
  function renderAll() { renderPills(); renderCalendar(); renderTimeline(); paint(); }
  function selectEvent(i, scroll) {
    if (!match(E[i])) { topic = 'All'; renderAll(); }
    selEv = i; selDay = null; $('calnote').textContent = '';
    paint();
    if (scroll) reveal([i]);
  }
  function pickDay(d) {
    const hits = E.map((e, i) => i).filter((i) => match(E[i]) && covers(E[i], d));
    selDay = d; selEv = hits.length ? hits[0] : null;
    if (hits.length) $('calnote').textContent = hits.length > 1 ? `${plural(hits.length, 'date')} cover ${M.wd(d)} ${d} ${M.month}.` : '';
    else {
      const next = E.findIndex((e) => e.from > d && match(e));
      $('calnote').innerHTML = `No source wrote about ${M.wd(d)} ${d} ${M.month}${topic === 'All' ? '' : ` for ${topic.toLowerCase()}`}.` + (next >= 0 ? ` <button data-ev="${next}">Next: ${M.range(E[next])}</button>` : '');
    }
    paint();
    if (hits.length) reveal(hits);
  }

  document.addEventListener('click', (ev) => {
    const t = ev.target;
    if (t.closest('a[href="#"]')) ev.preventDefault();
    if (t.closest('.addcal')) { const b = t.closest('.addcal'); b.classList.toggle('done'); b.textContent = b.classList.contains('done') ? 'Added' : '+ Add to calendar'; return; }
    if (t.closest('a')) return;
    const pill = t.closest('[data-topic]'), day = t.closest('[data-day]'), evt = t.closest('[data-ev]');
    if (t.closest('[data-earlier]')) { showPast = !showPast; renderTimeline(); paint(); return; }
    if (pill) { topic = pill.dataset.topic; if (selEv != null && !match(E[selEv])) selEv = null; selDay = null; $('calnote').textContent = ''; renderAll(); }
    else if (day) pickDay(+day.dataset.day);
    else if (evt) {
      const i = +evt.dataset.ev, card = evt.classList.contains('ev');
      if (card && evt.classList.contains('fold')) { opened.has(i) ? opened.delete(i) : opened.add(i); evt.classList.toggle('open', opened.has(i)); }
      selectEvent(i, !card);
    }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && ev.target.classList.contains('ev')) selectEvent(+ev.target.dataset.ev, false);
  });
  const hover = (ev) => {
    const el = ev.target.closest('.ev, .bar'), i = el ? +el.dataset.ev : null;
    if (i !== hoverEv) { hoverEv = i; paint(); }
  };
  document.addEventListener('mouseover', hover);
  document.addEventListener('focusin', hover);

  // ----- Stars and constellations (fixed pseudo-random, so they look the same on every load) -----
  {
    let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    let sky = '', cons = '';
    for (let i = 0; i < 150; i++) sky += `<circle cx="${(rnd() * 1500).toFixed(0)}" cy="${(rnd() * 1500).toFixed(0)}" r="${(0.6 + rnd() * 1.3).toFixed(1)}" fill="currentColor"/>`;
    for (const [cx, cy] of [[30, 70], [420, 1330], [1160, 110], [1300, 500], [740, 36], [90, 760], [1040, 800], [240, 1080], [1180, 1160]]) {
      let x = cx, y = cy; const pts = [];
      for (let i = 0, n = 4 + Math.floor(rnd() * 3); i < n; i++) { pts.push([x.toFixed(0), y.toFixed(0)]); x += 30 + rnd() * 70; y += rnd() * 110 - 55; }
      cons += `<polyline points="${pts.map((p) => p.join(',')).join(' ')}" fill="none" stroke="currentColor" stroke-width="1"/>` + pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="currentColor"/>`).join('');
    }
    const arcs = [300, 420, 560].map((r) => `<circle cx="1500" cy="0" r="${r}" fill="none" stroke="currentColor" stroke-width=".8" stroke-dasharray="1 6"/><circle cx="0" cy="1000" r="${r}" fill="none" stroke="currentColor" stroke-width=".8" stroke-dasharray="1 6"/>`).join('');
    $('deco').innerHTML = `<svg viewBox="0 0 1500 1500">${sky}${cons}${arcs}</svg>`;
  }

  const params = new URLSearchParams(location.search);
  if (TOPICS.includes(params.get('topic'))) topic = params.get('topic');
  renderNow(); renderAll();
  if (params.get('ev')) selectEvent(+params.get('ev'), false);
</script>
</body>
