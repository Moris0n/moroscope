<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Moroscope mockup D: Celestial</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:opsz,wght@9..144,400..700&display=swap" rel="stylesheet" />
<style>
  body { --bg0:#07051A; --bg1:#1C1147; --bg2:#3B1D6E; --ink:#F3EEFF; --soft:#A79FC9; --accent:#E9C46A; --onaccent:#1B1230;
    --good:#7FE0C3; --care:#FF9E7A; --key:#C9A7FF; --glass:rgba(255,255,255,.045); --line:rgba(255,255,255,.11); }
  body[data-p="aurora"] { --bg0:#020D14; --bg1:#07303A; --bg2:#0E5A5C; --ink:#EAFBF8; --soft:#8FB5B8; --accent:#9BF0E1; --onaccent:#04201F;
    --good:#A8F08E; --care:#FFB86B; --key:#A5B8FF; }
  body[data-p="dusk"] { --bg0:#12061A; --bg1:#3A1240; --bg2:#7A2A5E; --ink:#FFF0F4; --soft:#C3A0BD; --accent:#F6C9A8; --onaccent:#2A0F22;
    --good:#9FE3C5; --care:#FF8FA3; --key:#E3B5FF; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; color:var(--ink); font:15px/1.55 'DM Sans',system-ui,sans-serif; padding-bottom:84px; overflow-x:hidden;
    background:radial-gradient(120% 70% at 50% -10%, var(--bg2), var(--bg1) 45%, var(--bg0) 100%) fixed var(--bg0); transition:color .4s; }
  .serif, h1, h2, h3, .brand { font-family:'Fraunces',Georgia,serif; font-weight:500; }
  button { font:inherit; color:inherit; cursor:pointer; }
  /* Sky: stars and a slowly turning wheel behind everything */
  .sky { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .sky u { position:absolute; width:2px; height:2px; border-radius:50%; background:var(--ink); animation:twinkle 4s ease-in-out infinite; }
  .wheel { position:absolute; left:50%; top:-330px; width:900px; height:900px; margin-left:-450px; color:var(--accent); opacity:.3; }
  .wheel g { transform-origin:450px 450px; }
  .wheel .a { animation:spin 240s linear infinite; } .wheel .b { animation:spin 160s linear infinite reverse; } .wheel .c { animation:pulse 9s ease-in-out infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulse { 0%,100% { transform:scale(.94); opacity:.5; } 50% { transform:scale(1.06); opacity:1; } }
  @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.9; } }
  @media (prefers-reduced-motion:reduce) { .wheel g, .sky u { animation:none; } }
  .top, main { position:relative; z-index:1; max-width:1100px; margin:0 auto; }
  .top { padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .brand { font-size:20px; letter-spacing:.01em; }
  .top nav { display:none; gap:28px; font-size:14px; }
  .top nav a, .tabs a { color:var(--soft); text-decoration:none; } .top nav a.on, .tabs a.on { color:var(--accent); }
  .chip { border:1px solid var(--line); background:var(--glass); border-radius:999px; padding:6px 13px; font-size:13px; white-space:nowrap; }
  .hero { text-align:center; padding:26px 20px 6px; position:relative; z-index:1; }
  .kicker { font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--accent); }
  h1 { font-size:46px; line-height:1.05; margin-top:8px; letter-spacing:-.01em; text-shadow:0 0 40px color-mix(in srgb,var(--accent) 45%,transparent); }
  .monthnav { display:inline-flex; align-items:center; gap:18px; }
  .monthnav button { width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--glass); font-size:16px; color:var(--soft); }
  main { padding:16px; display:grid; grid-template-columns:minmax(0,1fr); gap:16px; }
  .card { background:var(--glass); border:1px solid var(--line); border-radius:22px; padding:16px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .filters { display:flex; gap:8px; overflow-x:auto; margin:0 -16px; padding:0 16px 2px; scrollbar-width:none; }
  .filters .chip.on { background:var(--accent); color:var(--onaccent); border-color:var(--accent); font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:16px; }
  .grid b { text-align:center; font-size:10px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--soft); padding-bottom:4px; }
  .cell { aspect-ratio:1/1.1; border:1px solid transparent; background:rgba(255,255,255,.035); border-radius:12px; padding:5px 4px 4px; display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0; }
  .cell .n { font-family:'Fraunces',Georgia,serif; font-size:17px; line-height:24px; width:26px; height:26px; border-radius:50%; text-align:center; }
  .cell.past { color:var(--soft); background:rgba(255,255,255,.015); } .cell.past i { opacity:.45; }
  .cell.today .n { background:var(--accent); color:var(--onaccent); font-weight:600; box-shadow:0 0 18px var(--accent); }
  .cell.sel { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 10%,transparent); }
  .cell i { display:block; width:100%; height:4px; border-radius:2px; }
  i.good { background:var(--good); box-shadow:0 0 8px var(--good); } i.care { background:var(--care); box-shadow:0 0 8px var(--care); } i.key { background:var(--key); box-shadow:0 0 8px var(--key); }
  .legend { display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:14px; font-size:12px; color:var(--soft); }
  .legend i { display:inline-block; width:14px; height:4px; margin-right:6px; vertical-align:middle; }
  .side { display:grid; gap:16px; align-content:start; }
  .side h2 { font-size:22px; line-height:1.2; }
  .sub { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); margin-bottom:4px; }
  .ev { margin-top:14px; padding:14px; border-radius:16px; border:1px solid var(--line); border-left:3px solid var(--c); background:linear-gradient(100deg, color-mix(in srgb,var(--c) 13%,transparent), transparent 70%); }
  .ev.good { --c:var(--good); } .ev.care { --c:var(--care); } .ev.key { --c:var(--key); }
  .ev .t { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--c); }
  .ev h3 { font-size:20px; line-height:1.25; margin-top:3px; }
  .ev p { font-size:14px; margin-top:5px; opacity:.85; }
  .ev .foot { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; margin-top:10px; font-size:12px; color:var(--soft); }
  .ev .foot button { border:1px solid var(--line); background:var(--glass); border-radius:999px; padding:6px 12px; font-size:12px; color:var(--ink); }
  .none { margin-top:10px; font-size:14px; color:var(--soft); }
  .next { margin-top:12px; padding:11px 14px; border:1px dashed var(--line); border-radius:14px; font-size:14px; width:100%; text-align:left; background:none; }
  .lead { font-family:'Fraunces',Georgia,serif; font-size:17px; line-height:1.5; margin-top:8px; }
  .lead::first-letter { float:left; font-size:3em; line-height:.85; padding:5px 8px 0 0; color:var(--accent); }
  .row { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; margin-top:14px; font-size:13px; color:var(--soft); }
  .primary { background:var(--accent); color:var(--onaccent); border:0; border-radius:999px; padding:11px 18px; font-weight:700; font-size:14px; white-space:nowrap; box-shadow:0 0 24px color-mix(in srgb,var(--accent) 45%,transparent); }
  .tabs { position:fixed; z-index:3; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:4px; padding:5px; background:color-mix(in srgb,var(--bg0) 80%,transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--line); border-radius:999px; font-size:13px; }
  .tabs a { padding:9px 18px; border-radius:999px; } .tabs a.on { background:var(--accent); color:var(--onaccent); font-weight:600; }
  /* Mockup control, not part of the design */
  .pal { position:fixed; z-index:4; right:12px; bottom:70px; display:flex; gap:8px; padding:8px; border-radius:999px; background:rgba(0,0,0,.45); border:1px solid var(--line); }
  .pal button { width:26px; height:26px; border-radius:50%; border:2px solid transparent; } .pal button.on { border-color:#fff; }
  @media (min-width:860px) {
    .pal { bottom:16px; }
    body { padding-bottom:0; } .tabs { display:none; } .top nav { display:flex; } h1 { font-size:68px; } .hero { padding-top:34px; }
    main { grid-template-columns:minmax(0,1fr) 380px; gap:20px; padding:24px 20px 48px; } .card { padding:22px; } .filters { margin:0; padding:0; }
    .cell { aspect-ratio:auto; height:82px; align-items:stretch; padding:8px; } .cell .n { align-self:flex-start; font-size:19px; }
  }
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="pal" id="pal" title="Mockup only: try the palettes">
  <button data-p="amethyst" style="background:linear-gradient(135deg,#3B1D6E,#E9C46A)" aria-label="Amethyst and gold"></button>
  <button data-p="aurora" style="background:linear-gradient(135deg,#0E5A5C,#9BF0E1)" aria-label="Aurora teal"></button>
  <button data-p="dusk" style="background:linear-gradient(135deg,#7A2A5E,#F6C9A8)" aria-label="Rose dusk"></button>
</div>
<header class="top">
  <span class="brand">Moroscope</span>
  <nav><a class="on" href="#">Calendar</a><a href="#">Sources</a><a href="#">You</a></nav>
  <span class="chip" id="who"></span>
</header>
<div class="hero">
  <p class="kicker">Your month, from the astrologers you trust</p>
  <div class="monthnav"><button aria-label="Previous month">&lsaquo;</button><h1 id="title"></h1><button aria-label="Next month">&rsaquo;</button></div>
</div>
<main>
  <section class="card">
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
    <div class="legend"><span><i class="good"></i>Good time to</span><span><i class="care"></i>Be careful</span><span><i class="key"></i>Key date</span></div>
  </section>
  <div class="side">
    <section class="card" id="day"></section>
    <section class="card"><p class="sub">The month in short</p><p class="lead" id="theme"></p>
      <div class="row"><span id="updated"></span><button class="primary">Add month to calendar</button></div></section>
  </div>
</main>
<nav class="tabs"><a class="on" href="#">Calendar</a><a href="#">Sources</a><a href="#">You</a></nav>
<script src="data.js"></script>
<script>
  const M = window.MOCK, $ = (id) => document.getElementById(id);
  // Sky: fixed pseudo-random stars and the wheel (rings, 12 spokes, tick marks).
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let sky = '';
  for (let i = 0; i < 90; i++) sky += `<u style="left:${(rnd() * 100).toFixed(1)}%;top:${(rnd() * 100).toFixed(1)}%;animation-delay:-${(rnd() * 4).toFixed(1)}s;transform:scale(${(0.4 + rnd()).toFixed(2)})"></u>`;
  const ring = (r, extra = '') => `<circle cx="450" cy="450" r="${r}" fill="none" stroke="currentColor" ${extra}/>`;
  let spokes = '', ticks = '';
  for (let i = 0; i < 12; i++) spokes += `<line x1="450" y1="40" x2="450" y2="130" stroke="currentColor" transform="rotate(${i * 30} 450 450)"/>`;
  for (let i = 0; i < 72; i++) ticks += `<line x1="450" y1="150" x2="450" y2="${i % 6 ? 160 : 172}" stroke="currentColor" transform="rotate(${i * 5} 450 450)"/>`;
  sky += `<svg class="wheel" viewBox="0 0 900 900"><g class="a">${ring(410)}${ring(320)}${spokes}</g><g class="b">${ring(300, 'stroke-dasharray="2 10"')}${ticks}</g>
    <g class="c">${[250, 205, 165, 130, 100, 74, 52].map((r) => ring(r, 'stroke-width=".8"')).join('')}</g></svg>`;
  $('sky').innerHTML = sky;

  let topic = 'All', sel = M.today;
  const shown = (d) => M.on(d).filter((e) => topic === 'All' || e.topics.includes(topic));
  $('who').textContent = `${M.glyph} ${M.sign}`;
  $('title').textContent = `${M.month} ${M.year}`;
  $('theme').textContent = M.theme;
  $('updated').textContent = `${M.usedCount} of ${M.sources.length} sources · updated today`;
  function render() {
    $('filters').innerHTML = ['All', ...M.topics].map((t) => `<button class="chip${t === topic ? ' on' : ''}" data-topic="${t}">${t}</button>`).join('');
    let g = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d) => `<b>${d}</b>`).join('') + '<span></span>'.repeat((M.dow(1) + 6) % 7);
    for (let d = 1; d <= M.days; d++) {
      const cls = [d < M.today ? 'past' : '', d === M.today ? 'today' : '', d === sel ? 'sel' : ''].join(' ');
      g += `<button class="cell ${cls}" data-day="${d}" aria-label="${d} ${M.month}"><span class="n">${d}</span>${shown(d).map((e) => `<i class="${e.type}"></i>`).join('')}</button>`;
    }
    $('grid').innerHTML = g;
    const evs = shown(sel);
    let h = `<p class="sub">${sel === M.today ? 'Today' : M.wd(sel)}</p><h2>${M.wd(sel)} ${sel} ${M.month}</h2>`;
    h += evs.map((e) => `<div class="ev ${e.type}"><div class="t">${M.typeLabel[e.type]} · ${M.range(e)}</div><h3>${e.title}</h3><p>${e.summary}</p>
      <div class="foot"><span>${e.topics.join(', ')} · ${e.sources.join(', ')}</span><button>Add to calendar</button></div></div>`).join('');
    if (!evs.length) {
      const next = M.events.find((e) => e.from > sel && (topic === 'All' || e.topics.includes(topic)));
      h += `<p class="none">No source wrote about this day. That is not a bad sign, just a quiet one.</p>`;
      if (next) h += `<button class="next" data-day="${next.from}"><b>Next:</b> ${next.title} · ${M.range(next)}</button>`;
    }
    $('day').innerHTML = h;
  }
  const setPalette = (p) => {
    document.body.dataset.p = p;
    document.querySelectorAll('#pal button').forEach((b) => b.classList.toggle('on', b.dataset.p === p));
  };
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-day],[data-topic],[data-p]');
    if (!el) return;
    if (el.dataset.p) return setPalette(el.dataset.p);
    if (el.dataset.day) sel = +el.dataset.day; else topic = el.dataset.topic;
    render();
  });
  setPalette(new URLSearchParams(location.search).get('p') || 'amethyst');
  render();
</script>
</body>
</html>
